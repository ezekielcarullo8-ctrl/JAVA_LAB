function start(ids){if(!ids.length)return;S={ids,i:0,ok:0,tries:0};go("quiz");rQ()}
function rQ(){const id=S.ids[S.i],q=Q[id],parts=q[2].split("__"),ans=q[3].split("|").map(f);
S.v=ans.map(()=>"");S.done=false;S.ans=ans;S.id=id;S.bank=shuf([...ans,...q[4].split("|").map(f)]);

function draw(res){const q=Q[S.id],parts=q[2].split("__");let h="";parts.forEach((p,i)=>{h+=hl(p);if(i<S.ans.length){const c=res?(res[i]?" ok":" no"):"",v=S.v[i];
h+=mode=="type"?`<input class="bl${c}" data-k=${i} value="${esc(v.endsWith("…")?"":v)}" placeholder="${v.endsWith("…")?v:""}" style="--w:${Math.max(70,S.ans[i].length*11+30)}px" autocapitalize=off autocomplete=off autocorrect=off spellcheck=false>`:`<button class="bl${c}" data-k=${i}>${v||"&nbsp;"}</button>`}});

$$("input.bl").forEach(e=>e.oninput=()=>{S.v[+e.dataset.k]=e.value});
$$("button.bl").forEach(e=>e.onclick=()=>{if(!S.done){S.v[+e.dataset.k]="";draw();bank()}});
bank()}
function bank(){const b=$("#bank");if(!b)return;b.innerHTML=S.bank.map(w=>`<button class="chip${S.v.includes(w)?" used":""}">${esc(w)}</button>`).join("");
$$(".chip").forEach(c=>c.onclick=()=>{if(S.done)return;const k=S.v.findIndex(x=>!x);if(k<0||c.classList.contains("used"))return;S.v[k]=c.textContent;draw()})}
function fbk(c,t){$("#fb").innerHTML=`<div class="fb ${c}">${t}</div>`}
function check(){if(S.done){return S.i+1<S.ids.length?(S.i++,rQ()):fin()}
const res=S.ans.map((a,i)=>norm(S.v[i])==norm(a));S.tries++;draw(res);
if(res.every(x=>x)){S.done=true;const first=S.tries==1;if(first)S.ok++;P.res[S.id]=first?1:(P.res[S.id]||0);P.xp+=first?10:4;save();$("#xp").textContent=P.xp+" XP";
fbk("g",(first?"Correct! +10 XP":"Correct! +4 XP (after hints or retries)"));$("#chk").textContent=S.i+1<S.ids.length?"Next":"Finish";$("#hint").style.display="none"}
else{P.res[S.id]=P.res[S.id]||0;save();fbk("r","Not yet. Red boxes are wrong. Edit them and check again, or use a hint.");if(S.lv!=null){S.h--;const hh=$("#hrt");hh&&(hh.innerHTML=hearts(Math.max(0,S.h)));if(S.h<=0)return failLv()}
if(S.tries>=3){const b=document.createElement("button");b.className="btn alt";b.textContent="Show answer";b.onclick=()=>{S.v=[...S.ans];S.done=true;draw(S.ans.map(()=>true));fbk("r","Answer shown. Review the lesson to lock it in.");$("#chk").textContent=S.i+1<S.ids.length?"Next":"Finish";b.remove()};$("#fb").appendChild(b)}}}

function rCourse(){const el=$("#course"),n=D.length,dn=D.filter((d,i)=>dayDone(i)).length;daysIn();
if(DAY!=null){rDay(el);sync();return}
let h=`<div class="row sp"><div><h1>Java in 30 Days</h1><p class=mut>A new day unlocks every day. ${dn}/${n} days complete.</p></div><div class=xp>${ic("flame")} ${C().fire}</div></div><div class=bar><i style="width:${dn/n*100}%"></i></div>`,w=-1;
D.forEach((d,i)=>{if(d[0]!=w){w=d[0];h+=`<div class=wh style="background:linear-gradient(135deg,${CL[w]})">${WN[w]}</div>`}
const st=dayState(i),off=6+50*(.5+.5*Math.sin(i*1.15));
h+=`<div class=pr style="margin-left:${off}%"><button class="nd ${st}${isBoss(i)?" boss":""}" data-d=${i}>${st=="lock"?ic("lock"):isBoss(i)?ic("crown"):i+1}</button><div><div class=nl>${esc(d[1])}</div><div class=stars>${"★".repeat(stars(i))}${"☆".repeat(3-stars(i))}</div></div></div>`});
el.innerHTML=h;$$("[data-d]").forEach(b=>b.onclick=()=>{const i=+b.dataset.d;
if(dayState(i)=="lock"){toast(i>0&&!dayDone(i-1)?"Finish Day "+i+" first":"Unlocks tomorrow. Come back daily to keep your streak!");return}
DAY=i;rCourse();$("main").scrollTop=0});
const o=el.querySelector(".nd.open");o&&o.scrollIntoView({block:"center"});sync()}
function rDay(el){const i=DAY,d=D[i],ls=L[d[2]],lab=d[5]>=0?LAB[d[5]]:null,ds=C().l[i],qs=stars(i);
el.innerHTML=`<div class="row sp"><button class=back id=bk>${ic("back")}Map</button><span class=mut>Day ${i+1} of ${D.length}</span></div><h1>${esc(d[1])}</h1><p class=mut>${WN[d[0]]}</p>
<div class=card><h2>${ic("book")} Lesson: ${ls[0]}</h2><p style="margin:8px 0;color:#c9cfee">${ls[2]}</p><pre>${hl(ls[3])}</pre><button class="btn ${ds?"alt":""}" style="width:100%;margin-top:10px" id=rd>${ds?ic("check")+" Read. Tap to review again":"I understand. Mark as read"}</button></div>
<div class=card><h2>${ic("puzzle")} Quiz level ${"★".repeat(qs)}${"☆".repeat(3-qs)}</h2><p class=mut style="margin:6px 0 10px">${d[4]} fill-the-code questions. You have 5 hearts and each wrong answer costs one.</p><button class=btn style="width:100%" id=qz>${qs?"Play again":"Start quiz"}</button></div>
${lab?`<div class=card><h2>${ic("code")} Code challenge: ${lab.t}</h2><p class=mut style="margin:6px 0 10px">${lab.sit}</p><button class=btn style="width:100%" id=lbn>${LD()[d[5]]?ic("check")+" Done. Open again":"Open in Code Lab"}</button></div>`:""}`;
$("#bk").onclick=()=>{DAY=null;rCourse()};
$("#rd").onclick=()=>{C().l[i]=1;act();save();toast("Lesson done! +5 XP");P.xp+=ds?0:5;save();$("#xp").textContent=P.xp+" XP";rDay(el)};
$("#qz").onclick=()=>start(qsFor(i),i);
const lb=$("#lbn");lb&&(lb.onclick=()=>{LB=d[5];go("lab")})}
function start(ids,lv){if(!ids.length)return;const fr=tab=="quiz"&&S?S.from:tab;S={ids,i:0,ok:0,tries:0,from:fr,lv:lv==null?null:lv,h:5};go("quiz");rQ()}
function fin(){const lv=S.lv,m=5-S.h;let st=0;if(lv!=null){st=m<=1?3:m<=3?2:1;const c=C();c.s[lv]=Math.max(c.s[lv]||0,st);P.xp+=20+st*10;act();save();$("#xp").textContent=P.xp+" XP"}
$("#quiz").innerHTML=`<div class=card style="text-align:center"><div class=big>${lv!=null?"★".repeat(st)+"☆".repeat(3-st):S.ok+"/"+S.ids.length}</div><p class=mut>${lv!=null?"Level cleared! +"+(20+st*10)+" XP":"solved on the first try"}</p></div><button class=btn id=again>${lv!=null?"Back to course":"Back to practice"}</button><button class="btn alt" id=les>Open lessons</button>`;
$("#again").onclick=()=>go(S.from||"home");$("#les").onclick=()=>go("learn")}
function failLv(){$("#quiz").innerHTML=`<div class=card style="text-align:center"><div style="color:#fb7185">${ic("heart","brk")}</div><h2>Out of hearts</h2><p class=mut style="margin-top:6px">Read the lesson again, then retry. Every try makes you stronger.</p></div><button class=btn id=rt>Try again</button><button class="btn alt" id=bk2>Back</button>`;
$("#rt").onclick=()=>start(S.ids,S.lv);$("#bk2").onclick=()=>go(S.from||"home")}

/* ===== NAVIGATION + MOBILE BACK BUTTON ===== */
let tab="course",DAY=null,depth=0,skip=false,armed=0;
function go(t){tab=t;if(t!="lab")LB=null;$$(".tab").forEach(x=>x.classList.toggle("on",x.id==t));
$$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.go==t||(t=="quiz"&&b.dataset.go==(S&&S.from||"home"))));$("main").scrollTop=0;
const m={home:rHome,course:rCourse,lab:rLab,learn:rLearn,prog:rProg};m[t]&&m[t]();$("#xp").textContent=P.xp+" XP";sync()}
$$("nav button").forEach(b=>b.onclick=()=>{if(b.dataset.go=="course")DAY=null;go(b.dataset.go)});
const layers=()=>(tab!="course"?1:0)+((tab=="quiz"||(tab=="lab"&&LB!=null)||(tab=="course"&&DAY!=null))?1:0);
function sync(){const n=layers();if(n>depth){while(depth<n)history.pushState({d:++depth},"")}else if(n<depth){skip=true;const k=depth-n;depth=n;history.go(-k)}}
function back(){if(tab=="quiz"){go(S&&S.from||"home");return}if(tab=="lab"&&LB!=null){LB=null;rLab();return}if(tab=="course"&&DAY!=null){DAY=null;rCourse();return}if(tab!="course")go("course")}
addEventListener("popstate",()=>{if(skip){skip=false;return}depth--;
if(depth<0){depth=0;if(Date.now()-armed<2200){const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;A&&A.exitApp?A.exitApp():history.back();return}
armed=Date.now();toast("Press back again to exit");history.pushState({d:0},"");return}
back();sync()});
history.replaceState({b:1},"");history.pushState({d:0},"");
rHome();rCourse();$("#xp").textContent=P.xp+" XP";

</script></body></html>
